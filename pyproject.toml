[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeme-oem-sdk"
version = "1.0.0"
description = "Stable OEM SDK and programmatic embedding client for Codeme verification engines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Codeme Maintainers", email = "oss@codeme.io"}
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["codeme_oem_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
